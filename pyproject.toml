[project]
name = "sentinel"
version = "0.1.0"
description = "A guardian agent that catches confidently-wrong AI answers before they reach vulnerable people"
requires-python = ">=3.12"
authors = [
    { name = "Ankit Lade", email = "ankitlade12@gmail.com" },
]
dependencies = [
    # Core service
    "pydantic>=2.0.0,<3.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sse-starlette>=2.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.3",
    "numpy>=1.26,<3.0",
    # Reasoning — Gemini via the unified Google GenAI SDK (Vertex or AI Studio)
    "google-genai>=1.0.0",
    # Agent runtime — Google Agent Development Kit (ADK)
    "google-adk>=0.3.0",
    # Corpus RAG + quarantine store — Vertex AI + Firestore (live path)
    "google-cloud-aiplatform>=1.71.0",
    "google-cloud-firestore>=2.18.0",
    # Arize spine — Phoenix tracing (OpenInference), evals, MCP introspection
    "arize-phoenix>=7.0.0",
    "arize-phoenix-otel>=0.6.0",
    "arize-phoenix-evals>=0.17.0",
    "openinference-instrumentation-google-genai>=0.1.0",
    "openinference-instrumentation-google-adk>=0.1.0",
    "openinference-instrumentation-vertexai>=0.1.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp>=1.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
    "mypy>=1.11.0",
    "pydantic-to-typescript>=2.0.0",
    "pre-commit>=3.7.0",
    "types-pyyaml>=6.0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend", "scripts"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = [
    "E501",    # line length handled by formatter
    "RUF022",  # keep __all__ grouped by domain with comments, not alphabetized
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["backend.tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
module = [
    "google.adk.*",
    "google.genai.*",
    "google.cloud.*",
    "vertexai.*",
    "phoenix.*",
    "openinference.*",
    "opentelemetry.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
addopts = "-v --strict-markers --tb=short"
markers = [
    "unit: fast, isolated unit tests",
    "integration: tests that exercise multiple modules",
    "contract: protocol conformance tests (run against mock + live corpus/store)",
    "live: tests that hit real Google Cloud / Phoenix; skipped unless GOOGLE_CLOUD_PROJECT and PHOENIX_API_KEY env vars are set",
    "slow: deselect by default; downloads or network-bound eval calls",
]
filterwarnings = [
    "ignore:Pydantic serializer warnings:UserWarning",
]
